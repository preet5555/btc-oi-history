name: Collect BTC OI levels

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collector
        run: node scripts/collect.js

      - name: Commit updated data
        run: |
          git config user.name "oi-collector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-levels.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update OI levels [skip ci]"
          git push
